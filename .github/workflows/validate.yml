name: Проверка патча

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Проверить JavaScript
        shell: pwsh
        run: |
          node --check .\src\ru-map.cjs
          node --check .\src\patch.cjs
          node --check .\src\build-manifest.cjs

      - name: Проверить PowerShell и манифест
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Install-Russian.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Uninstall-Russian.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

          $manifest = Get-Content -Raw '.\patch-manifest.json' | ConvertFrom-Json
          if ($manifest.patchVersion -ne '1.4.9') {
            throw "Неожиданная версия патча: $($manifest.patchVersion)"
          }
          $appDirectories = @($manifest.builds | ForEach-Object { [string]$_.appDirectory } | Sort-Object)
          $expectedDirectories = @('app-3.6.10', 'app-3.6.11')
          if (Compare-Object $appDirectories $expectedDirectories) {
            throw "Неожиданные версии GitHub Desktop: $($appDirectories -join ', ')"
          }
