name: Проверка патча

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Проверить JavaScript
        shell: pwsh
        run: |
          node --check .\src\ru-map.cjs
          node --check .\src\patch.cjs
          node --check .\src\build-manifest.cjs

      - name: Проверить PowerShell и манифест
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Install-Russian.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Uninstall-Russian.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

          $manifest = Get-Content -Raw '.\patch-manifest.json' | ConvertFrom-Json
          if ($manifest.patchVersion -ne '1.3.0') {
            throw "Неожиданная версия патча: $($manifest.patchVersion)"
          }
          if ($manifest.supportedAppDirectory -ne 'app-3.6.4') {
            throw "Неожиданная версия GitHub Desktop: $($manifest.supportedAppDirectory)"
          }
